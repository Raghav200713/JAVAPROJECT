<!DOCTYPE html>
<html>
<head>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  body { margin: 0; padding: 0; }
  .page {
    width: 8.5in;
    height: 11in;
    padding: 0.8in;
    box-sizing: border-box;
    page-break-after: always;
    position: relative;
    font-family: sans-serif;
  }
</style>
</head>
<body>
  <div class='page'><h1>Test Page 7</h1><p>This is a test.</p></div>
</body>
</html>
